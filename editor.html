<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>織夢劇本編輯器</title>
  <link rel="stylesheet" href="./src/editor/styles/editor.css" />
</head>
<body>
  <div id="editor-app">
    <!-- ===== 頂部：主分頁 + 動作 ===== -->
    <header class="topbar">
      <div class="brand">織夢</div>

      <nav class="main-tabs">
        <button class="main-tab active" data-page="script">劇本</button>
        <button class="main-tab" data-page="assets">資產</button>
        <button class="main-tab" data-page="map">敘事地圖</button>
        <button class="main-tab" data-page="theme">個性化</button>
        <button class="main-tab" data-page="publish">發布</button>
        <button class="main-tab" data-page="settings">設定</button>
      </nav>

      <div class="global-search">
        <input id="global-search" type="search" placeholder="全域搜尋…  (Ctrl+Shift+F)" autocomplete="off" />
        <div id="global-search-results" class="gs-results" style="display:none"></div>
      </div>

      <div class="topbar-actions">
        <span id="project-name" class="project-name">(未開啟)</span>
        <span id="dirty-indicator" class="dirty-indicator" style="display:none">有未儲存變更</span>
        <button id="btn-open" class="tb-btn">開啟專案</button>
        <button id="btn-new" class="tb-btn">新專案</button>
        <button id="btn-undo" class="tb-btn" title="復原 (Ctrl+Z)">↶</button>
        <button id="btn-redo" class="tb-btn" title="重做 (Ctrl+Shift+Z)">↷</button>
        <button id="btn-save" class="tb-btn primary" title="儲存 (Ctrl+S)">儲存</button>
        <button id="btn-export-zip" class="tb-btn" title="匯出整個專案為 ZIP（備份／分享）">⬇ ZIP</button>
      </div>
    </header>

    <!-- ===== 頁面容器 ===== -->
    <div class="pages">

      <!-- ---------- 劇本頁：結構樹 ｜ 事件卡片 ｜ 預覽＋檢查器 ---------- -->
      <section class="page page-script active" data-page="script">
        <aside class="col col-structure">
          <div class="col-head">
            <span id="scene-count">場景</span>
            <div class="col-head-actions">
              <button id="btn-new-scene" title="新增場景">＋</button>
              <button id="btn-delete-scene" title="刪除目前場景">刪除</button>
            </div>
          </div>
          <div class="structure-search">
            <input id="scene-search" type="search" placeholder="搜尋場景…" />
          </div>
          <ul id="scene-list" class="scene-list"></ul>
        </aside>

        <main class="col col-events">
          <div class="events-head">
            <span id="events-scene-name" class="events-scene-name">—</span>
            <div class="view-modes">
              <button class="view-mode active" data-mode="cards" title="卡片編輯">✏️ 卡片</button>
              <button class="view-mode" data-mode="md" title="Markdown 原文（可手寫）">☰ Markdown</button>
              <button class="view-mode" data-mode="json" title="JSON（機器格式）">{ } JSON</button>
            </div>
          </div>
          <div id="main-content"></div>
          <div id="source-view" class="source-view" style="display:none">
            <textarea id="source-text" spellcheck="false"></textarea>
            <div class="source-actions">
              <span id="source-status" class="source-status"></span>
              <button id="btn-source-revert" class="tb-btn">還原</button>
              <button id="btn-source-apply" class="tb-btn primary">套用變更</button>
            </div>
          </div>
        </main>

        <aside class="col col-preview">
          <div id="preview-host" class="preview-host"></div>
          <div class="inspector">
            <div class="inspector-tabs">
              <button class="insp-tab active" data-target="lint-panel">問題</button>
              <button class="insp-tab" data-target="inspector-panel">檢查器</button>
            </div>
            <div id="lint-panel" class="insp-panel"></div>
            <div id="inspector-panel" class="insp-panel" style="display:none">
              <div class="panel-empty">選取指令後，這裡會顯示細部參數。<br><small>（S3 實作）</small></div>
            </div>
          </div>
        </aside>
      </section>

      <!-- ---------- 資產頁：分類入口 ｜ 內容 ---------- -->
      <section class="page page-assets" data-page="assets">
        <aside class="col col-asset-nav">
          <div class="col-head"><span>資產</span></div>
          <button class="asset-nav-btn active" data-asset-view="overview">總覽</button>
          <button class="asset-nav-btn" data-asset-view="characters">角色</button>
          <button class="asset-nav-btn" data-asset-view="backgrounds">背景</button>
          <button class="asset-nav-btn" data-asset-view="bgm">BGM</button>
          <button class="asset-nav-btn" data-asset-view="se">音效</button>
          <button class="asset-nav-btn" data-asset-view="voice">語音</button>
          <button class="asset-nav-btn" data-asset-view="video">視頻</button>
          <button class="asset-nav-btn" data-asset-view="positions">位置與錨點</button>
        </aside>
        <main class="col col-asset-main">
          <div id="asset-overview" class="asset-page-host"></div>
          <div id="asset-characters-page" class="asset-page-host" style="display:none">
            <div id="character-manager"></div>
            <div class="asset-files-divider">立繪檔案</div>
            <div id="asset-files-characters"></div>
          </div>
          <div id="asset-kind-backgrounds" class="asset-page-host" style="display:none"></div>
          <div id="asset-kind-bgm" class="asset-page-host" style="display:none"></div>
          <div id="asset-kind-se" class="asset-page-host" style="display:none"></div>
          <div id="asset-kind-voice" class="asset-page-host" style="display:none"></div>
          <div id="asset-kind-video" class="asset-page-host" style="display:none"></div>
          <div id="position-editor" class="asset-page-host" style="display:none"></div>
        </main>
      </section>

      <!-- ---------- 敘事地圖頁：sidebar（地圖／變量管理／結局）｜ 右側主區 ---------- -->
      <section class="page page-map" data-page="map">
        <aside class="col col-map-nav">
          <div class="col-head"><span>敘事地圖</span></div>
          <button class="map-nav-btn active" data-map-view="graph">🗺 地圖</button>
          <button class="map-nav-btn" data-map-view="flags">🔢 變量管理</button>
          <button class="map-nav-btn" data-map-view="endings">🏁 結局</button>
        </aside>
        <main class="col col-map-main">
          <div id="map-graph-view" class="map-view-host">
            <div id="graph-content"></div>
          </div>
          <div id="map-flags-view" class="map-view-host" style="display:none">
            <div id="var-manage"></div>
            <div id="flag-panel"></div>
          </div>
          <div id="map-endings-view" class="map-view-host" style="display:none">
            <div id="ending-manage"></div>
          </div>
        </main>
      </section>

      <!-- ---------- 個性化 / 發布 / 設定：骨架 ---------- -->
      <section class="page page-plain" data-page="theme">
        <div class="page-placeholder">
          <h2>個性化</h2>
          <p>遊戲外觀主題：文字框樣式、字體、配色。</p>
          <p class="muted">尚未實作（計畫 S 階段）。</p>
        </div>
      </section>

      <section class="page page-plain" data-page="publish">
        <div class="page-placeholder">
          <h2>發布</h2>
          <p>目前可用工具列的「⬇ ZIP」匯出整個專案。</p>
          <p class="muted">一鍵產生可上傳的網頁版：尚未實作。</p>
        </div>
      </section>

      <section class="page page-plain" data-page="settings">
        <div class="page-placeholder">
          <h2>專案設定</h2>
          <p class="muted">故事的標題、作者與起始場景。</p>
          <div id="project-settings" class="project-settings"></div>
          <h2 class="settings-sub">編輯器偏好</h2>
          <label class="pref-row">
            <input type="checkbox" id="pref-autosave" />
            自動存檔（任何改動後 2.5 秒自動寫回；狀態列可隨時切換）
          </label>
        </div>
      </section>
    </div>

    <!-- ===== 狀態列 ===== -->
    <footer class="statusbar">
      <button id="status-autosave" class="status-item status-btn" title="點擊切換自動存檔">○ 自動存檔</button>
      <span id="status-project" class="status-item">未開啟專案</span>
      <span id="status-backend" class="status-item"></span>
      <span class="status-spacer"></span>
      <span id="status-scenes" class="status-item"></span>
    </footer>
  </div>

  <script type="module" src="./src/editor/main.js"></script>
</body>
</html>
